[project]
name = "shopeasy-api"
version = "0.1.0"
description = "ShopEasy E-commerce API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [
    { name = "Mamoudou Diallo", email = "diam657@uqo.ca" }
]
keywords = ["ecommerce", "django", "api"]

dependencies = [
    # Django core
    "django>=5.2,<6.0",
    "djangorestframework>=3.15,<4.0",

    # Database
    "psycopg[binary]>=3.2",

    # Cache
    "redis>=5.0,<6.0",

    # Environment
    "python-decouple>=3.8",

    # Security
    "argon2-cffi>=23.1",
    "djangorestframework-simplejwt>=5.3",
    "django-axes>=7.0",
    "django-cors-headers>=4.4",

    # API documentation
    "drf-spectacular>=0.27",

    # Multi-currency
    "py-moneyed>=3.0",

    # Async tasks (installed, not configured Sprint 1)
    "celery>=5.4,<6.0",
]

[dependency-groups]
dev = [
    # Testing
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "factory-boy>=3.3",

    # Linting & formatting
    "ruff>=0.5",

    # Type checking
    "mypy>=1.10",
    "django-stubs>=5.0",
    "djangorestframework-stubs>=3.15",

    # Security scanning
    "bandit>=1.7",
    "pip-audit>=2.7",

    # Mutation testing (payments/orders)
    "mutmut>=2.5",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["shopeasy", "core"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "S",      # flake8-bandit
    "DTZ",    # flake8-datetimez
    "DJ",     # flake8-django
]
ignore = [
    "S101",   # assert allowed in tests
]

[tool.ruff.lint.isort]
known-first-party = ["shopeasy", "core"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "shopeasy.settings"
python_files = ["test_*.py", "*_test.py"]
# TODO(sprint-3): Raise --cov-fail-under back to 85 once real tests exist (CLAUDE.md §11.1)
addopts = [
    "--strict-markers",
    "-ra",
    "--cov=shopeasy",
    "--cov=core",
    "--cov-report=term-missing",
    "--cov-fail-under=50",
]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = [
    "mypy_django_plugin.main",
]
exclude = [
    "migrations/",
    "tests/",
]

[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "decouple"
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "shopeasy.settings"

[tool.coverage.run]
branch = true
source = ["shopeasy", "core"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
