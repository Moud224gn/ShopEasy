name: "Technical Debt"
description: Track a known technical limitation, suboptimal pattern, or refactoring opportunity
labels: ["tech-debt", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template to track technical debt items that are not currently bugs but represent
        risk, slowdown, or future pain. Honest documentation of debt is better than hidden debt.

  - type: textarea
    id: description
    attributes:
      label: What is the debt?
      description: Describe the current suboptimal state factually
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: How does this debt slow us down? What risk does it carry?
      placeholder: |
        - Slows feature X by Y%
        - Risk of regression in Z scenario
        - Onboarding cost for new developers
        - Performance penalty under load
    validations:
      required: true

  - type: textarea
    id: origin
    attributes:
      label: How did this debt originate?
      description: Trade-off taken intentionally? Result of an incident? Tool limitation?

  - type: textarea
    id: proposed
    attributes:
      label: Proposed resolution
      description: How would you fix this? Reference patterns, ADRs, or RFCs.

  - type: dropdown
    id: effort
    attributes:
      label: Estimated effort to fix
      options:
        - S (less than 1 day)
        - M (1-3 days)
        - L (4-10 days)
        - XL (more than 10 days)
        - Unknown
    validations:
      required: true

  - type: dropdown
    id: urgency
    attributes:
      label: Urgency
      options:
        - Critical (must fix before next major release)
        - High (should fix this quarter)
        - Medium (fix when possible)
        - Low (nice to have)
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: Current workaround (if any)
      description: What do we do today to live with this debt?
